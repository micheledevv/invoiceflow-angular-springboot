<div
  class="app-layout"
  [class.app-layout--auth-page]="isAuthPage()"
  [class.theme-dark]="isDarkMode()">
  <app-sidebar></app-sidebar>

  @if (isFormOpen()) {
    <app-invoice-form></app-invoice-form>
  }

  <main class="app-layout__content">
    <router-outlet></router-outlet>
  </main>
  
  <app-notification-host></app-notification-host>
  <app-loader></app-loader>
  <app-generic-modal></app-generic-modal>
</div>
