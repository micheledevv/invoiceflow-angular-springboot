<div class="not-found-page">

      <span>!</span>

    <p class="not-found-card__eyebrow">Errore 404</p>

    <h1 class="not-found-card__title">
      Pagina non trovata

    <p class="not-found-card__description">
      La pagina che stai cercando non esiste, è stata spostata oppure l’indirizzo inserito non è corretto.

    <div class="not-found-card__actions">

        (click)="goBack()">

      </button>

      <button 
        type="button" 
        class="btn btn-primary"

        Vai alle fatture
      </button>
