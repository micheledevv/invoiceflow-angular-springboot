<nav class="sidebar">
  <a
    class="sidebar__logo"
    routerLink="/"
    aria-label="Vai alla panoramica fatture"
    (click)="closeMobileMenu()">
    <img src="assets/images/logo.svg" alt="InvoiceFlow logo">
  </a>

  <button
    class="sidebar__theme-toggle"
    type="button"
    aria-label="Cambia tema"
    title="Cambia tema"
    (click)="toggleTheme()">

    @if (themeService.isDarkMode()) {
      <img src="assets/images/icon-sun.svg" alt="">
    } @else {
      <img src="assets/images/icon-moon.svg" alt="">
    }
  </button>

  @if (currentUser()) {
    <button
      class="sidebar__menu-toggle"
      [class.sidebar__menu-toggle--open]="mobileMenuIsOpen()"
      type="button"
      aria-label="Apri menu di navigazione"
      aria-controls="sidebar-navigation"
      [attr.aria-expanded]="mobileMenuIsOpen()"
      (click)="toggleMobileMenu()">
      <span></span>
      <span></span>
      <span></span>
    </button>
  }

  <div
    id="sidebar-navigation"
    class="sidebar__footer"
    [class.sidebar__footer--open]="mobileMenuIsOpen()">

    @if (currentUser()) {
      <button
        class="sidebar__home"
        type="button"
        aria-label="Panoramica fatture"
        title="Panoramica fatture"
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }">
        <img
          class="sidebar__nav-icon"
          src="assets/images/icon-home.svg"
          alt="">
        <span class="sidebar__label">Panoramica</span>
      </button>

      <button
        class="sidebar__settings"
        type="button"
        aria-label="Impostazioni"
        title="Impostazioni"
        (click)="openSettingsPanel()">
        <img
          class="sidebar__nav-icon"
          src="assets/images/icon-settings.svg"
          alt="">
        <span class="sidebar__label">Impostazioni</span>
      </button>


      <button
        class="sidebar__clients"
        type="button"
        aria-label="Clienti"
        title="Clienti"
        routerLink="/clients"
        routerLinkActive="is-active">
        <img
          class="sidebar__nav-icon"
          src="assets/images/icon-clients.svg"
          alt="">
        <span class="sidebar__label">Clienti</span>
      </button>

      <button
        class="sidebar__sent-invoices"
        type="button"
        aria-label="Fatture inviate"
        title="Fatture inviate"
        routerLink="/sent-invoices"
        routerLinkActive="is-active">
        <img
          class="sidebar__nav-icon"
          src="assets/images/icon-sent-invoices.svg"
          alt="">
        <span class="sidebar__label">Fatture inviate</span>
      </button>


      <button
        class="sidebar__logout"
        type="button"
        aria-label="Esci"
        title="Esci"
        (click)="logout()">
        <img
          class="sidebar__nav-icon sidebar__nav-icon--logout"
          src="assets/images/icon-logout.svg"
          alt="">
        <span class="sidebar__label">Esci</span>
      </button>
    }

    @if (currentUser()) {
      <hr>

      <div class="sidebar__avatar">
        <img
          [src]="currentUser()?.avatarBase64 || 'assets/images/logo.svg'"
          [alt]="'Avatar di ' + currentUser()?.fullName">
      </div>
    }

  </div>
</nav>

@if (mobileMenuIsOpen()) {
  <button
    type="button"
    class="sidebar__menu-backdrop"
    aria-label="Chiudi menu di navigazione"
    (click)="closeMobileMenu()">
  </button>
}

@if (settingsPanelIsOpen()) {
  <app-settings-panel (closed)="closeSettingsPanel()"></app-settings-panel>
}
