<div class="auth-page">
  <div class="auth-card">

    <div class="auth-card__header">
      <h1>Accedi</h1>
      <p>Entra nel tuo account InvoiceFlow</p>
    </div>

    <form class="auth-form" (submit)="login(); $event.preventDefault()">

      <app-generic-input
        label="Email:"
        [isRequired]="true"
        id="email"
        type="email"
        placeholder="mario.rossi@test.it"
        [field]="loginForm.email">
      </app-generic-input>

      <app-generic-input
        label="Password:"
        [isRequired]="true"
        id="password"
        type="password"
        placeholder="Password"
        [field]="loginForm.password">
      </app-generic-input>

      @if (errorMessage()) {
        <p class="auth-error">{{ errorMessage() }}</p>
      }

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="isSubmitDisabled()">
        {{ isLoading() ? 'Accesso...' : 'Accedi' }}
      </button>

    </form>

    <p class="auth-footer">
      Non hai un account?
      <a routerLink="/register">Registrati</a>
    </p>

  </div>
</div>
