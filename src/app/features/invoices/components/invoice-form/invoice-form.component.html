<div class="invoice-form-backdrop">
  <aside class="invoice-form-panel">
    <div class="invoice-form-content">

      <h1 class="heading-m">
        {{ title() }}
      </h1>

      <section class="invoice-form-section">
        <h2 class="invoice-form-section__title">Da chi viene emessa</h2>

        <app-generic-input
          label="Nome / Ragione sociale:"
          [isRequired]="true"
          id="sender-name"
          [field]="invoiceForm.senderName">
        </app-generic-input>

        <app-generic-input
          label="Indirizzo:"
          [isRequired]="true"
          id="sender-street"
          [field]="invoiceForm.senderAddress.street">
        </app-generic-input>

        <div class="invoice-form-grid invoice-form-grid--3">
          <app-generic-input
            label="Città:"
            [isRequired]="true"
            id="sender-city"
            [field]="invoiceForm.senderAddress.city">
          </app-generic-input>

          <app-generic-input
            label="CAP:"
            [isRequired]="true"
            id="sender-post-code"
            [onlyNumbers]="true"
            [field]="invoiceForm.senderAddress.postCode">
          </app-generic-input>

          <app-generic-input
            label="Paese:"
            [isRequired]="true"
            id="sender-country"
            [field]="invoiceForm.senderAddress.country">
          </app-generic-input>
        </div>
      </section>

      <section class="invoice-form-section">
        <h2 class="invoice-form-section__title">Cliente</h2>

        <app-generic-input
          label="Nome cliente:"
          [isRequired]="true"
          id="client-name"
          [field]="invoiceForm.clientName">
        </app-generic-input>

        <app-generic-input
          label="Email cliente:"
          [isRequired]="true"
          id="client-email"
          type="email"
          [field]="invoiceForm.clientEmail">
        </app-generic-input>

        <app-generic-input
          label="Indirizzo:"
          [isRequired]="true"
          id="client-street"
          [field]="invoiceForm.clientAddress.street">
        </app-generic-input>

        <div class="invoice-form-grid invoice-form-grid--3">
          <app-generic-input
            label="Città:"
            [isRequired]="true"
            id="client-city"
            [field]="invoiceForm.clientAddress.city">
          </app-generic-input>

          <app-generic-input
            label="CAP:"
            [isRequired]="true"
            id="client-post-code"
            [onlyNumbers]="true"
            [field]="invoiceForm.clientAddress.postCode">
          </app-generic-input>

          <app-generic-input
            label="Paese:"
            [isRequired]="true"
            id="client-country"
            [field]="invoiceForm.clientAddress.country">
          </app-generic-input>
        </div>
      </section>

      <section class="invoice-form-section">
        <div class="invoice-form-grid invoice-form-grid--2">
          <app-calendar-input
            label="Data fattura:"
            [isRequired]="true"
            id="created-at"
            [field]="invoiceForm.createdAt">
          </app-calendar-input>

          <app-select-input
            label="Termini di pagamento:"
            [isRequired]="true"
            id="payment-terms"
            [field]="invoiceForm.paymentTerms"
            [options]="paymentTermsOptions">
          </app-select-input>
        </div>

        <app-generic-input
          label="Descrizione progetto:"
          [isRequired]="true"
          id="description"
          [field]="invoiceForm.description">
        </app-generic-input>
      </section>

      <section class="invoice-form-section">
        <h2 class="invoice-form-items-title">Lista articoli</h2>

        <div class="items-list">
          <div class="items-list__header">
            <p>Nome articolo</p>
            <p>Q.tà</p>
            <p>Prezzo</p>
            <p>Totale</p>
            <span></span>
          </div>

          @for (item of invoiceModel().items; track $index; let i = $index) {
            <div class="items-list__row">
              <app-generic-input
                label="Nome articolo"
                [labelIsVisible]="false"
                [isRequired]="true"
                [id]="'item-name-' + i"
                [field]="invoiceForm.items[i].name">
              </app-generic-input>

              <app-generic-input
                label="Quantità"
                [labelIsVisible]="false"
                [isRequired]="true"
                [id]="'item-quantity-' + i"
                type="number"
                [onlyNumbers]="true"
                [field]="invoiceForm.items[i].quantity">
              </app-generic-input>

              <app-generic-input
                label="Prezzo"
                [labelIsVisible]="false"
                [isRequired]="true"
                [id]="'item-price-' + i"
                type="number"
                [field]="invoiceForm.items[i].price">
              </app-generic-input>

              <div class="item-total">
                <p>{{ getItemTotal(i) | euroCurrency }}</p>
              </div>

              <button
                type="button"
                class="item-delete"
                aria-label="Elimina articolo"
                [disabled]="!canRemoveItem()"
                [title]="canRemoveItem() ? 'Elimina articolo' : 'Deve esserci almeno un articolo'"
                (click)="removeItem(i)">
                <img src="assets/images/icon-delete.svg" alt="">
              </button>
            </div>
          }

          <button
            type="button"
            class="btn btn-add-item"
            [disabled]="!canAddItem()"
            [title]="canAddItem() ? 'Aggiungi nuovo articolo' : 'Hai raggiunto il limite massimo di articoli'"
            (click)="addItem()">
            + Aggiungi nuovo articolo
          </button>
        </div>
      </section>

      @if (mode() === 'edit') {
        <app-actions-button
          [discardIsVisible]="true"
          [saveChangesIsVisible]="true"
          [setJustifyContent]="'flex-end'"
          [saveChangesDisabled]="isFormInvalid()"
          (discardClicked)="closeForm()"
          (saveChangesClicked)="saveChanges()">
        </app-actions-button>
      } @else {
       <app-actions-button
        [discardIsVisible]="true"
        [saveAndSendIsVisible]="true"
        [saveChangesIsVisible]="false"
        [saveAsDraftIsVisible]="true"
        [setJustifyContent]="'space-between'"
        [saveAndSendDisabled]="isFormInvalid()"
        [saveAsDraftDisabled]="isFormInvalid()"
        (discardClicked)="closeForm()"
        (saveAsDraftClicked)="saveAsDraft()"
        (saveAndSendClicked)="saveAndSend()">
    </app-actions-button>
      }

    </div>
  </aside>
</div>
