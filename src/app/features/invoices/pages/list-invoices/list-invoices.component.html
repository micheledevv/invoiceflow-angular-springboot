<div class="invoices-page">
  <div class="invoices-content">

    <header class="invoice-list-header">
      <div class="invoice-list-heading">
        <h1 class="heading-m">Fatture</h1>
        <p class="body-text-variant">{{ invoicesSummary() }}</p>
      </div>

      <div class="invoice-list-actions">
        @if (hasInvoices()) {
          <select
            [formField]="filtersForm.selectedStatus"
            class="invoice-filter"
            id="status"
            aria-label="Filtra fatture per stato">
            @for (filter of statusFilters; track filter.value) {
              <option [value]="filter.value">{{ filter.label }}</option>
            }
          </select>
        }

        <button
          type="button"
          class="btn btn-primary-icon"
          (click)="openCreateForm()">
          <span class="btn-primary-icon__circle">+</span>
          Nuova Fattura
        </button>
      </div>
    </header>

  @if (filteredInvoices().length === 0) {
    <div class="empty-invoices">
      <div class="empty-invoices__image">
        <img src="assets/images/illustration-empty.svg" alt="">
      </div>

      <h2>{{ emptyStateTitle() }}</h2>

      <p class="body-text-variant">
        {{ emptyStateDescription() }}
      </p>
    </div>
  } @else {
    <app-invoice-records
      [invoices]="filteredInvoices()"
      (invoiceDetail)="goToDetail($event)">
    </app-invoice-records>
  }

  </div>
</div>
