<div class="alert-banner" [class]="'alert-banner--' + type()">

  <div class="alert-banner__icon">
    @switch (type()) {
      @case ('success') {
        <span>✓</span>
      }

      @case ('error') {
        <span>!</span>
      }

      @case ('warning') {
        <span>!</span>
      }

      @case ('info') {
        <span>i</span>
      }
    }
  </div>

  <div class="alert-banner__content">
    <div class="alert-banner__title">
      <ng-content select="[alert-title]"></ng-content>
    </div>

    <div class="alert-banner__message">
      <ng-content select="[alert-message]"></ng-content>
    </div>
  </div>

  @if (closable()) {
    <button
      type="button"
      class="alert-banner__close"
      aria-label="Chiudi notifica"
      (click)="close()">
      ×
    </button>
  }

</div>
