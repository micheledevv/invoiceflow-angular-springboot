<div class="form-field">
  <div class="form-field__header">
    <label
      class="form-label"
      [class.form-label--error]="firstError()"
      [attr.for]="id()">
      
      {{ label() }}
        @if (isRequired()) {
          <span>*</span>
        }
    </label>

    @if (firstError()) {
      <p class="form-error">{{ firstError() }}</p>
    }
  </div>

  <input
    class="form-control form-control--date"
    [class.form-control--error]="firstError()"
    [id]="id()"
    type="date"
    [formField]="field()"
  />
</div>
