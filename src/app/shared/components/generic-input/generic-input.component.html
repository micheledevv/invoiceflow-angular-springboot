<div class="form-field">
  @if (labelIsVisible()) {
    <div
      class="form-field__header"
      [class.form-field__header--error]="firstError()">

      <label
        class="form-label"
        [class.form-label--error]="firstError()"
        [attr.for]="id()">
        {{ label() }}
        @if (isRequired()) {
          <span>*</span>
        }
      </label>

      @if (firstError()) {
        <p class="form-error">{{ firstError() }}</p>
      }
    </div>
  }

  <input
    class="form-control"
    [class.form-control--error]="firstError()"
    [id]="id()"
    [type]="type()"
    [placeholder]="placeholder()"
    [formField]="field()"
    [attr.inputmode]="onlyNumbers() ? 'numeric' : null"
    (beforeinput)="blockInvalidInput($event)"
    (paste)="blockInvalidPaste($event)"
  />
</div>
