<div class="invoice-records">
  @for (invoice of invoices(); track invoice.id) {
    <article
      class="invoice-record"
      role="button"
      tabindex="0"
      [attr.aria-label]="'Apri fattura ' + invoice.id"
      (keydown.enter)="invoiceDetail.emit(invoice)"
      (keydown.space)="invoiceDetail.emit(invoice); $event.preventDefault()"
      (click)="invoiceDetail.emit(invoice)">
      <p class="invoice-record__id">
        <span>#</span>{{ invoice.id }}
      </p>

      <p class="invoice-record__date">
        {{ invoice.createdAt | italianDate }}
      </p>

      <p class="invoice-record__client">
        {{ invoice.clientName }}
      </p>

      <p class="invoice-record__total">
        {{ invoice.total | euroCurrency }}
      </p>

      <div class="invoice-record__status invoice-status invoice-status--{{ invoice.status }}">
        <span></span>
        {{ getStatusLabel(invoice.status) }}
      </div>

      <button type="button" class="invoice-record__arrow" aria-label="Apri fattura">
        <img src="assets/images/icon-arrow-right.svg" alt="">
      </button>

      @if (getDueWarning(invoice); as dueWarning) {
        <div
          class="due-alert"
          [class.due-alert--overdue]="dueWarning.type === 'overdue'"
          [class.due-alert--today]="dueWarning.type === 'today'"
          [class.due-alert--tomorrow]="dueWarning.type === 'tomorrow'"
          [class.due-alert--soon]="dueWarning.type === 'soon'"
          [attr.aria-label]="dueWarning.message"
          (click)="$event.stopPropagation()">

          <div class="due-alert__icon">
            !

            <div class="due-alert__tooltip" role="tooltip">
              <p>{{ dueWarning.message }}</p>
            </div>
          </div>
        </div>
      }
    </article>
  }
</div>
