@if (loaderService.isLoading()) {
  <div class="loader-backdrop">
    <div class="loader-card">
      <div class="loader-logo">
        <span></span>
      </div>

      <div class="loader-spinner"></div>

      <p class="loader-title">{{loaderService.messageLoader()}}</p>
      <p class="loader-subtitle">Un attimo, sto preparando tutto...</p>
    </div>
  </div>
}
